# Use -n to select the INDI instance. Only one acc000 producer may run.
[sim]
fps=6000
seed=42
modeSeed=123
leverArm=10

[adc]
zero=2048
voltsPerBit=0.0083799
sensitivity=1.02

[sensor]
noisePSD=1e-8

[accel]
numChannels=2

[framegrabber]
shmimName=acc000
circBuffLength=1
# Set threadPrio=0 for an unprivileged local development run.
threadPrio=2
cpuset=

[fps]
device=
property=fps
element=current
tol=0

[numChannels]
device=
property=numChannels
element=current
tol=0

[synchro]
# Empty selects timer mode. A named source is attached as a semaphore consumer.
shmimName=
postDelay=0
alpha=0.01
dtTransfer_ns=3000
wfsProcess_ns=51500
dtF_ns=10000
wfsRead_ns=276100
delayLockAbsThreshold_ns=50000
delayLockFracThreshold=0.1
cadenceGuard_ns=20000

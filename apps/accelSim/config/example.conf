# Use -n to select the INDI instance. Only one acc000 producer may run.
[sim]
fps=6000
# Startup-only: publish calibrated zero acceleration without changing simulated motion or DM injection.
zeroOutput=false
seed=42
modeSeed=123
leverArm=10

[optical]
# Fraction of each mode's pointing in the DM (optical TT) disturbance, each in [0,1]; the accelerometer still senses
# every mode fully. Empty couples all modes fully; one value applies to all modes; otherwise 15 values: the 14
# prominent modes (11,14,17,20,25,28,54,56,58,75,85,120,220,300 Hz), then one shared by the 200 weak modes.
coupling=
# Linear scale of an independent optical-only realization of the same vibration model, which the accelerometer
# does not sense; 0 disables it.
amplitude=0
# Random seed of that independent realization.
seed=7

[adc]
zero=2048
voltsPerBit=0.0083799
sensitivity=1.02

[sensor]
noisePSD=1e-8

[accel]
numChannels=2

[framegrabber]
shmimName=acc000
circBuffLength=1
# Set threadPrio=0 for an unprivileged local development run.
threadPrio=2
cpuset=

[fps]
device=
property=fps
element=current
tol=0

[numChannels]
device=
property=numChannels
element=current
tol=0

[synchro]
# Empty selects timer mode. A named source supplies phase references, not output triggers.
shmimName=
# Set a known nominal WFS rate (e.g. 2000); zero learns the first measured interval.
# Keep fps.device empty unless its subscription supplies the desired accelerometer rate.
referenceFps=0
# Reference silence and source retry interval [seconds]; sampling continues in holdover.
timeout=0.01
# Maximum future-interval phase correction, as a fraction of an accelerometer period.
maxSlew=0.05
postDelay=0
alpha=0.01
dtTransfer_ns=3000
wfsProcess_ns=51500
dtF_ns=10000
wfsRead_ns=276100
delayLockAbsThreshold_ns=50000
delayLockFracThreshold=0.1
cadenceGuard_ns=20000

[dm]
# Configure ONLY after exclusive handover from tweeterModulator/bridge writers.
# Intended experiment source: dm01disp10_aux through syncopation. Empty performs no DM access.
channelName=
# Absolute paths to the approved TT cube (first two planes) and its dmmask.
modeCube=
mask=
# Start disabled; set dm_scale.target and toggle dm_enable at runtime.
enabled=false
# Independent experiment/commissioning linear amplitude factor in [0,100].
scale=0
maxRelativeResidual=1e-6
# DM worker real-time priority and dedicated cpuset (see acc000.conf); 0 and empty keep SCHED_OTHER defaults.
threadPrio=0
cpuset=
# DM output uses the existing producer schedule, independently of accelerometer rate or WFS phase lock.

[syncopation]
# Required when dm.channelName is configured; use the existing production-v2 scheduler name.
timingStream=
writeLeadUs=50

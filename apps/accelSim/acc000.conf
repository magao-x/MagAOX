# Use -n to select the INDI instance. Only one acc000 producer may run.
[sim]
fps=8000
# Startup-only: publish calibrated zero acceleration without changing simulated motion or DM injection.
zeroOutput=false
seed=42
modeSeed=123
leverArm=10

[optical]
# Fraction of each mode's pointing in the DM (optical TT) disturbance, each in [0,1]; the accelerometer still senses
# every mode fully. Empty couples all modes fully; one value applies to all modes; otherwise 15 values: the 14
# prominent modes (11,14,17,20,25,28,54,56,58,75,85,120,220,300 Hz), then one shared by the 200 weak modes.
coupling=
# Initial optical_coupling INDI value: a common factor in [0,1] multiplying every coupling above.
commonCoupling=1
# Initial optical_amplitude INDI value in [0,100]: linear scale of an independent optical-only realization of the
# same vibration model, which the accelerometer does not sense; 0 disables it.
amplitude=0
# Random seed of that independent realization.
seed=7

[adc]
zero=2048
voltsPerBit=0.0083799
sensitivity=1.02

[sensor]
noisePSD=1e-8

[accel]
numChannels=2

[framegrabber]
shmimName=acc000
circBuffLength=128
# Set threadPrio=0 for an unprivileged local development run.
threadPrio=2
cpuset=

[fps]
device=
property=fps
element=current
tol=0

[numChannels]
device=
property=numChannels
element=current
tol=0

[synchro]
# Empty selects timer mode. A named source supplies phase references, not output triggers.
shmimName=
# Set a known nominal WFS rate (e.g. 2000); zero learns the first measured interval.
# Keep fps.device empty unless its subscription supplies the desired accelerometer rate.
referenceFps=2000
# Reference silence and source retry interval [seconds]; sampling continues in holdover.
timeout=0.01
# Maximum future-interval phase correction, as a fraction of an accelerometer period.
maxSlew=0.05
postDelay=0
alpha=0.01
dtTransfer_ns=3000
wfsProcess_ns=51500
dtF_ns=10000
wfsRead_ns=276100
delayLockAbsThreshold_ns=50000
delayLockFracThreshold=0.1
cadenceGuard_ns=20000

[dm]
# Tagged source only. Never write the destination directly.
channelName=dm01disp10_aux
# Absolute path to the approved TT cube; its first two planes define the command's spatial structure.
# Existing documented TT cube; verify its deployed revision.
modeCube=/opt/MagAOX/cacao/tweeter-vispyr/tweeter-vispyr-calibs/default/CMmodesDM/CMmodesDM.00.fits
# Mode-coefficient calibration K: simulated pointing [rad] -> coefficients of the two planes. The command is always
# the full first two planes times K; nothing is masked. "coefficients" uses K below with no mask and no fit.
# These values are the validated dmmask fit for CMmodesDM.00 (README, "Calibration methods"). If the cube changes,
# regenerate them: start once with calibration=fit and mask=<dmmask.fits>, then copy K from the startup log or
# dm_calibration.k00..k11.
calibration=coefficients
# K00,K01,K10,K11 [mode coefficient/rad]; rows are modes 0/1, columns simulated X/Y.
coefficients=-798911.751168,-315942.594932,318826.690493,-792420.649088
# Only for calibration=fit: optional fitting weights (dmmask.fits). Empty uses weights 1.0 on all 50x50 pixels; the
# fit then fails unless the modes are the physical tilt plane over the whole grid.
mask=
# Start disabled; set dm_scale.target and toggle dm_enable at runtime.
enabled=false
# Independent experiment/commissioning linear amplitude factor in [0,100].
scale=0
maxRelativeResidual=1e-6
# DM worker thread, as dmSpeckle's [modulator]: the established syncopation-producer priority (20, below the
# scheduler's 30) on a dedicated provider cpuset separate from dmtweeter-synco and acc000 (spare30).
# Verify on the RTC that spare31 exists and holds no other tasks before starting.
threadPrio=20
cpuset=spare31
# Keep the existing WFS phase-reference settings above; they do not gate DM output.

[syncopation]
# REQUIRED: name of the existing production-v2 scheduler stream for dm01disp10_aux.
# Use the deployed stream name; accelSim does not create or configure the scheduler.
timingStream=dmtweeter_synco_timing
# The producer waits until cutoff-writeLeadUs before committing; a later-observed request commits at once.
# accelSim prepares surfaces ahead, so waiting only reduces margin. 125 us (one 8-kHz subframe) commits each
# request as soon as it becomes eligible (after the previous slot's cutoff and receipt).
writeLeadUs=125

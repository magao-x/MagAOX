# Use -n to select the INDI instance. Only one acc000 producer may run.
[sim]
fps=8000
# Startup-only: publish calibrated zero acceleration without changing simulated motion or DM injection.
zeroOutput=false
seed=42
modeSeed=123
leverArm=10

[adc]
zero=2048
voltsPerBit=0.0083799
sensitivity=1.02

[sensor]
noisePSD=1e-8

[accel]
numChannels=2

[framegrabber]
shmimName=acc000
circBuffLength=128
# Set threadPrio=0 for an unprivileged local development run.
threadPrio=2
cpuset=

[fps]
device=
property=fps
element=current
tol=0

[numChannels]
device=
property=numChannels
element=current
tol=0

[synchro]
# Empty selects timer mode. A named source supplies phase references, not output triggers.
shmimName=
# Set a known nominal WFS rate (e.g. 2000); zero learns the first measured interval.
# Keep fps.device empty unless its subscription supplies the desired accelerometer rate.
referenceFps=2000
# Reference silence and source retry interval [seconds]; sampling continues in holdover.
timeout=0.01
# Maximum future-interval phase correction, as a fraction of an accelerometer period.
maxSlew=0.05
postDelay=0
alpha=0.01
dtTransfer_ns=3000
wfsProcess_ns=51500
dtF_ns=10000
wfsRead_ns=276100
delayLockAbsThreshold_ns=50000
delayLockFracThreshold=0.1
cadenceGuard_ns=20000

[dm]
# Tagged source only. Never write the destination directly.
channelName=dm01disp10_aux
# Absolute paths to the approved TT cube (first two planes) and its dmmask.
# Existing documented TT cube; verify its deployed revision and matching mask.
modeCube=/opt/MagAOX/cacao/tweeter-vispyr/tweeter-vispyr-calibs/default/CMmodesDM/CMmodesDM.00.fits
mask=
# Startup enable is prohibited. Arm using dm_enable.toggle after handover/readiness checks.
enabled=false
# Independent experiment/commissioning amplitude factor in [0,1].
scale=0
maxRelativeResidual=1e-6
# Set sim.fps=8000 for injection; the existing ~2-kHz reference does not pace DM writes.

# Instrument values are deliberately unconfirmed. These defaults permit acquisition, never output.
# Supply the existing [synchro].shmimName and mask above; do not infer either from a rate.
# Review actual route dm01disp10_aux -> dm01disp10 and its independent combination with DDSPC.
output_authorized=false
routing_verified=false
max_abs_um=0
max_step_um=0
ack_timeout_us=0

[syncopation]
# Existing production-version-2 timing source; fill the actual deployed name.
timingStream=
writeLeadUs=50

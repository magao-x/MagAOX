# Incomplete template for sensor instance autoJay-camsci1 (executable autoJay).
# Replace every TODO/REQUIRED field; unresolved numeric tolerances deliberately prevent loading.
# Commission this optical profile and its controller matrix separately from camflowfs.

[shmimMonitor]
shmimName=camsci1

[autoJay]
camera=camsci1
profile=camsci1
# Local camera configuration uses flipLR. Confirm deployed stream orientation and use a stable identity here.
orientation=TODO_CONFIRM_flipLR
aoLoop=holoop

[ncpc]
channel=dm02disp02
trigger=
pokeX=
pokeY=
pokeAmp=0

[tweeter]
channel=dm01disp02
# ICC relays this command channel to RTC.
trigger=
pokeX=
pokeY=
pokeAmp=0

[setup]
# Supply the calibrated fwscind selection, stagebs/stagesci1 positions, and their tolerances.
# Select the desired PICam readout_speed and vshift_speed switch elements; values=1 requires them On.
# readout_speed: ccd_00_1MHz, ccd_01MHz, emccd_05MHz, emccd_10MHz, emccd_20MHz, emccd_30MHz.
# vshift_speed: 0_7us, 1_2us, 2_0us, 5_0us. exptime.current and emgain.current are captured with '*'.
# Add other required mask/filter states to all six parallel arrays.
devices=fwscind,stagebs,stagesci1,camsci1,camsci1,camsci1,camsci1,holoop
properties=filterName,position,position,exptime,emgain,readout_speed,vshift_speed,loop_state
elements=TODO_FILTER,current,current,current,current,TODO_READOUT,TODO_VSHIFT,toggle
values=1,TODO_STAGEBS_MM,TODO_STAGESCI1_MM,*,*,1,1,0
types=2,0,0,0,0,2,2,2
tolerances=0,TODO_STAGEBS_TOLERANCE,TODO_STAGESCI1_TOLERANCE,0.000000001,0,0,0,0

[acquisition]
frames=5
settleFrames=2
# Time both DMs from the local writes. Commission the delay with the ICC-to-RTC relay active.
dmSleep=0.01
phaseTimeout=5
dmTolerance=0.00001

[quality]
maxShift=5
minCorrelation=0.5
minSnr=3
minOverlap=0.25
minReferenceEnergy=0.25
maxSecondaryRatio=0.95
peakExclusion=2
# saturation=REQUIRED_FOR_SELECTED_CAMERA_SETTINGS

[control]
enabled=false
# When enabled, this local delay must cover command delivery and physical settling.
settle=0.2

[monitor]
# Maximum time without a coherent camera frame, in seconds.
maxAge=5

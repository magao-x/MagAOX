# Example controller instance: autoJay-camflowfs-ctrl (executable closedLoopIndi).
# This file intentionally refuses startup until all four measured matrix entries are supplied.

[input]
device=autoJay-camflowfs
property=measurement
elements=delta_x,delta_y
counterElement=counter
references=0,0
guarded=true
maxAge=5

[ctrl]
devices=ttmperi,ttmperi
properties=axis1_voltage,axis2_voltage
currents=current,current
targets=target,target
requireOperating=true

[loop]
# REQUIRED: measured detector-pixel residual to voltage correction matrix for this camera/profile.
# target = current - gain * diag(gains) * matrix * residual
# Supply every entry explicitly, including any measured zeros. Do not substitute an identity matrix.
# intMat00=MEASURED
# intMat01=MEASURED
# intMat10=MEASURED
# intMat11=MEASURED
gain=0.1
gains=1,1
upstream=autoJay-camflowfs
upstreamProperty=ready
upstreamFollowClosed=false

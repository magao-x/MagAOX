# Example sensor instance: autoJay-camflowfs (executable autoJay).
# Choose the execution host and confirm camera/DM stream routes before installation.
# Confirm both actuator lists and supply signed poke amplitudes before capture.
# Add the calibrated bump-mask/filter requirements to every setup array below.

[shmimMonitor]
shmimName=camflowfs

[autoJay]
camera=camflowfs
profile=camflowfs
orientation=native
aoLoop=holoop

[ncpc]
channel=dm02disp02
trigger=
# Candidate coordinates from the local ncpcAlign-bump-wfs config.
pokeX=13,20,27,27,13,20,6,6
pokeY=24,24,20,13,9,9,20,13
pokeAmp=0

[tweeter]
channel=dm01disp02
# ICC relays this command channel to RTC.
trigger=
# Candidate coordinates from the local twAlign-camwfs-wfs config.
pokeX=13,13,37,37
pokeY=13,37,13,37
pokeAmp=0

[setup]
# Arrays are parallel. Types: 0 number, 1 text, 2 switch. '*' records the capture-time value.
# All four PVCAM readout switches are captured, so a later mode change invalidates the setup.
# PVCAM does not expose emgain. The stageflowfs pupil preset is not the required numeric 32.0.
devices=stagelosel,stagelosel,stageflowfs,camflowfs,camflowfs,camflowfs,camflowfs,camflowfs,holoop
properties=presetName,position,position,exptime,readout_speed,readout_speed,readout_speed,readout_speed,loop_state
elements=pupil,current,current,current,sensitivity,speed,dynamic_range,sub_electron,toggle
values=1,*,32.0,*,*,*,*,*,0
types=2,0,0,0,2,2,2,2,2
tolerances=0,0.01,0.01,0.000000001,0,0,0,0,0

[acquisition]
frames=5
settleFrames=2
# Time both DMs from the local writes. Commission the delay with the ICC-to-RTC relay active.
dmSleep=0.01
phaseTimeout=5
dmTolerance=0.00001

[quality]
maxShift=5
# Provisional thresholds: validate with the chosen patterns, camera mode, and bump mask.
minCorrelation=0.5
minSnr=3
minOverlap=0.25
minReferenceEnergy=0.25
maxSecondaryRatio=0.95
peakExclusion=2
# Set saturation to the first invalid mean pixel value for the selected readout mode.
# The default is effectively unbounded; PVCAM speed uses 8-bit pixels, other modes use 16-bit pixels.
# saturation=REQUIRED_FOR_SELECTED_READOUT_MODE

[control]
# Allow a controller to use accepted measurements only after commissioning it.
enabled=false
# When enabled, this local delay must cover command delivery and physical settling.
settle=0.2

[monitor]
# Maximum time without a coherent camera frame, in seconds.
maxAge=5

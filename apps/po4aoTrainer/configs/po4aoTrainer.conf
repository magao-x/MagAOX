# Install with the existing XDevice config/process registration workflow.
# xindidriver needs one second without output to finish its startup FIFO flush.
sleep_interval_sec = 2.0
po4ao_device = "po4ao"
training_config = "/opt/MagAOX/config/po4ao_training.conf"
runtime_config = "/opt/MagAOX/config/po4ao.conf"
# Example shared location: operator must provision and verify this on the target host.
artifact_root = "/data/po4aoTrainer"
# Optional; an empty value uses artifact_root/saved_engines.
saved_engines = ""
# Set to the installed branch@commit before recording scientific data.
source_revision = "unrecorded"
freshness_timeout = 5.0
operation_timeout = 30.0
worker_timeout = 120.0
collection_timeout = 120.0
build_timeout = 300.0
heartbeat_timeout = 30.0

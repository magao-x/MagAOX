# Managed nonlinear training settings; runtime geometry comes from po4ao.conf.
[MDP]
n_history = 8
control_delay = 0
planning_horizon = 4

[RL]
# Notebook ACTION_PENALTY_WEIGHT: normalized action-magnitude penalty.
loss_function_penalty = 0.01

[NN_models]
training_batch = 128
policy_architecture = "nonlinear_local"

[nonlinear]
architecture = "nonlinear_local"
channels = 32
shared_layers = 3
negative_slope = 0.1
low_order_modes = 50
global_hidden = 4
global_features = 2

[training]
dynamics_pretrain_steps = 1000
dynamics_grad_steps = 100
policy_grad_steps = 20
dynamics_learning_rate = 0.001
policy_learning_rate = 0.001
dynamics_gradient_clip_norm = 0.5
policy_gradient_clip_norm = 0.5
validation_episodes = 1
diagnostics_interval = 50
model_publish_interval = 50
first_model_publish_iteration = 150
max_policy_clip_fraction = 0.02
max_candidate_action_rms_ratio = 5.0
training_iterations = 3000

[normalization]
rms_floor_fraction = 0.001

[replay_buffers]
historical_seconds = 120
historical_episodes = 20
train_warmup_percent = 0.2
train_historical_percent = 0.2

[policy_update]
# Notebook POLICY_UPDATE_PENALTY_WEIGHT: normalized change from the acknowledged policy.
penalty = 0.5
anchor_samples = 128

[diagnostics]
sample_rate_hz = 2000

[compute]
training_device = 1
build_device = 1

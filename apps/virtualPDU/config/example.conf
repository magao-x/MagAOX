# Example configuration for a virtualPDU instance named vpdu0.
# Replace illustrative device/channel names with the installation's names.
[device]
pollInterval=5
staleTimeout=15

[outlet1]
device=pdu0
channel=fwtelsim

[outlet2]
device=usbhub0
channel=fwtelsim

[fwtelsim]
outlets=1,2
# Order indices are zero-based positions in the outlets list.
onOrder=0,1
offOrder=1,0
# Milliseconds between commands. The first entry is ignored.
onDelays=0,500
offDelays=0,500

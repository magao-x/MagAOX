# Example configuration for a pvcamCtrl instance controlling a Kinetix, e.g. camllowfs.
# The PCIe port below is from the 2026-10 MagAO-X Dolphin PXH832 layout and must be confirmed per installation:
# power off the camera and verify the app does not report that the port stayed up.
[camera]
serialNumber=A22J723005

[power]
device=pdu0
channel=camllowfs

[pcie]
# Switch downstream port above this camera.  Leave empty (or omit) to disable PCIe hotplug.
downstreamPort=0000:42:09.0
# Seconds between hotplug attempts while the camera is missing.
retryInterval=30

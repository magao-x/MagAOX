# Example configuration for a pvcamCtrl instance controlling a Kinetix: camllowfs on MagAO-X.
# The PCIe port is from the MagAO-X Dolphin PXH832 layout, confirmed 2026-10-09 by powering off camllowfs and
# observing its port's link go down (camflowfs is on 0000:42:09.0).  Confirm the port for each installation the
# same way; the camera names printed by the vendor hotplug script are guesses and were wrong here.
[camera]
serialNumber=A22J723005

[power]
device=pdu0
channel=camllowfs

[pcie]
# Switch downstream port above this camera.  Leave empty (or omit) to disable PCIe hotplug.
downstreamPort=0000:42:08.0
# Seconds between hotplug attempts while the camera is missing.
retryInterval=30

# Merge these sections into sysMonRTC.conf after instrument qualification.
# Dedicated targets follow rtSetup/RTC/move_irqs. NVIDIA is deliberately absent:
# its IRQs remain on system CPUs and are not dedicated loop IRQs.
[gpu]
enabled=true
interval=5
timeout=2
# expectedUUIDs=GPU-xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx

# Optional: these are the RAID autodiscovery defaults.
[raid]
enabled=true
interval=5

[irq]
interval=5

[irq.camwfs]
match=edt
cpuset=camwfs_irq

[irq.woofer]
match=cp2x72c
cpuset=woofer

[irq.shmimTCP]
match=enx98b78501aebc
cpuset=shmimTCP

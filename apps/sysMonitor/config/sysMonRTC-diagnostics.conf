# Merge these sections into sysMonRTC.conf after instrument qualification.
# Dedicated targets follow rtSetup/RTC/move_irqs. NVIDIA is deliberately absent:
# its IRQs remain on system CPUs and are not dedicated loop IRQs.
[gpu]
enabled=true
interval=5
timeout=2
# expectedUUIDs=GPU-xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx

# Discover all arrays and require the UUIDs supplied for RTC/exao2 on 2026-11-16.
[raid]
enabled=true
interval=5

# / (observed as md126)
[raid.root]
uuid=c6c547cb-ddad-6475-bf0e-e3a05ad49fda

# /boot (observed as md125)
[raid.boot]
uuid=34351f6c-220c-6147-48bc-085cfb8798ea

# /boot/efi (observed as md123)
[raid.boot_efi]
uuid=6e636195-51bf-7574-21df-b4ac081ad05b

# /data (observed as md124)
[raid.data]
uuid=5504e9bd-d4e8-8a5f-69d7-36775dbc6329

# Observed as md127, absent from df; role/label awaiting operator confirmation.
[raid.unmounted]
uuid=49e59ba1-704e-b7f6-3deb-0f47a955d3ec

[irq]
interval=5

[irq.camwfs]
match=edt
cpuset=camwfs_irq

[irq.woofer]
match=cp2x72c
cpuset=woofer

[irq.shmimTCP]
match=enx98b78501aebc
cpuset=shmimTCP

# Place this file in the configured stateRuleEngine rules directory.
[sysMonRTC-irq-warning]
ruleType=swVal
property=sysMonRTC.irq_warning
element=active
target=On
priority=warning
message=RTC dedicated IRQ placement is incorrect or unverified; inspect sysMonRTC.irq_status and sysMonRTC fault logs

[sysMonICC-irq-warning]
ruleType=swVal
property=sysMonICC.irq_warning
element=active
target=On
priority=warning
message=ICC dedicated IRQ placement is incorrect or unverified; inspect sysMonICC.irq_status and sysMonICC fault logs

[sysMonRTC-raid-warning]
ruleType=swVal
property=sysMonRTC.raid_warning
element=active
target=On
priority=warning
message=RTC RAID is degraded, faulty, missing, or unverified; inspect sysMonRTC.raid_status and sysMonRTC fault logs

[sysMonICC-raid-warning]
ruleType=swVal
property=sysMonICC.raid_warning
element=active
target=On
priority=warning
message=ICC RAID is degraded, faulty, missing, or unverified; inspect sysMonICC.raid_status and sysMonICC fault logs

[sysMonAOC-raid-warning]
ruleType=swVal
property=sysMonAOC.raid_warning
element=active
target=On
priority=warning
message=AOC RAID is degraded, faulty, missing, or unverified; inspect sysMonAOC.raid_status and sysMonAOC fault logs

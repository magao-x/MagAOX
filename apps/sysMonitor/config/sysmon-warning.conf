# Place this file in the configured stateRuleEngine rules directory.
[sysMonRTC-irq-warning]
ruleType=swVal
property=sysMonRTC.irq_warning
element=active
target=On
priority=warning
message=RTC dedicated IRQ placement is incorrect or unverified; inspect sysMonRTC.irq_status and irq_details

[sysMonICC-irq-warning]
ruleType=swVal
property=sysMonICC.irq_warning
element=active
target=On
priority=warning
message=ICC dedicated IRQ placement is incorrect or unverified; inspect sysMonICC.irq_status and irq_details

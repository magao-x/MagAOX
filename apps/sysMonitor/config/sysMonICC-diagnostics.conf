# Merge these sections into sysMonICC.conf after instrument qualification.
# Dedicated targets follow rtSetup/ICC/move_irqs, including the confirmed
# PVCAM identities. NVIDIA IRQs remain on system CPUs, outside this rule set.
[gpu]
enabled=true
interval=5
timeout=2

# Optional: these are the RAID autodiscovery defaults.
[raid]
enabled=true
interval=5

[irq]
interval=5

[irq.camsci1]
match=enx503eaa0ceeff
cpuset=camsci1

[irq.camsci2]
match=enx503eaa0cf4cd
cpuset=camsci2

[irq.shmimTCP]
match=enx98b78501ae64
cpuset=shmimTCP

[irq.camflowfs]
match=pvcamPCIE_1
cpuset=camflowfs

[irq.camllowfs]
match=pvcamPCIE_0
cpuset=camllowfs

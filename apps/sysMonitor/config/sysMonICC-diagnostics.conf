# Merge these sections into sysMonICC.conf after instrument qualification.
# Dedicated targets follow rtSetup/ICC/move_irqs, including the confirmed
# PVCAM identities. NVIDIA IRQs remain on system CPUs, outside this rule set.
[gpu]
enabled=true
interval=5
timeout=2

# Discover all arrays and require the UUIDs supplied for ICC/exao3 on 2026-11-16.
[raid]
enabled=true
interval=5

# / (observed as md127)
[raid.root]
uuid=e57c275f-2a7d-5fb0-a57a-dea72a404594

# /boot (observed as md125)
[raid.boot]
uuid=516dc8e9-815f-7669-049c-0deda37c831c

# /boot/efi (observed as md124)
[raid.boot_efi]
uuid=c59f734b-4492-a3df-8bb5-3a8d7898b0e4

# /data (observed as md123)
[raid.data]
uuid=36f4feb6-be61-b471-133a-b7bf4dabddcb

# Observed as md126, absent from df; role/label awaiting operator confirmation.
[raid.unmounted]
uuid=71f54c37-d403-a338-cc00-6b25c6df6fc8

[irq]
interval=5

[irq.camsci1]
match=enx503eaa0ceeff
cpuset=camsci1

[irq.camsci2]
match=enx503eaa0cf4cd
cpuset=camsci2

[irq.shmimTCP]
match=enx98b78501ae64
cpuset=shmimTCP

[irq.camflowfs]
match=pvcamPCIE_1
cpuset=camflowfs

[irq.camllowfs]
match=pvcamPCIE_0
cpuset=camllowfs

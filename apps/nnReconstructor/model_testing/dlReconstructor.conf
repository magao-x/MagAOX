# Prepared isolated test for the trained bright_002 model.
# Prefer MODEL_DIR/tensorrt_fp32/dlReconstructor.conf generated by export_engine:
# it uses your actual model path and recorded crop/normalization automatically.
# First test only: nn2026B_test_modes must have no control-loop/DM consumer.
# Input must remain CPU-backed float32, 120 x 120, matching collection.
[shmimMonitor]
shmimName=aol1_imWFS2
cpuset=acqu_mvm
threadPrio=45

[framegrabber]
shmimName=nn2026B_test_modes
cpuset=acqu_mvm
threadPrio=45

[parameters]
engineDirs=/home/rlandman/NNReconstructor_2026B/models/20261015/bright_002/tensorrt_fp32
engineName=model_fp32.trt
rebuildEngine=false
imageNorm=1
modalNorm=1
m_pupPix=64
pup_offset1_x=0
pup_offset1_y=0
pup_offset2_x=60
pup_offset2_y=60

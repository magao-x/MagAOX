# PRIVATE REVIEW TEMPLATE ONLY. Do not install over a production configuration.
# See ../EXAO2_TESTING.md. No DM writer or actuator enable exists in accelFFCtrl.
# Copy to a new private directory; verify the existing producer before enabling shadow.
[input]
# Repository default; confirm actual CPU-resident UINT16 (2,1,1), channels 0/1.
# Eight-channel telescope recordings are NOT accepted by this native app.
shmimName=acc000
# Unprivileged initial test; do not assume an available CPU or change producer affinity.
threadPrio=0
cpuset=
# SIMULATOR EXAMPLE: replace in the private copy with the verified current rate (e.g. 4000).
sampleRate=8000
maxBatch=256
predictionFps=2000
telemetryFps=5
allowSingleFrameGap=false
# Software validity bounds, not hardware command limits. Preserve depth-one producer configuration.
maxAge_us=2000
maxInterval_us=2000
maxPrediction_ms=50
clockTolerance_us=1000

[parameters]
# Single carrier only. Verify the source frequency; unchanged accelSim population includes 28 Hz.
frequency=28
memory_time=0.1
# These are EXISTING SIMULATOR calibration values, not measured telescope constants.
# Match the verified simulator producer, or obtain physical calibration before interpreting units.
# Native channel order is 0=X, 1=Y, positive polarity; rotation is sensor-to-model axes in degrees.
lever_arm=10
rotation=0
# Milliseconds beyond the actual prediction query; measurement age is included once by the estimator.
prediction_horizon=1
adc_zero_x=2048
adc_zero_y=2048
adc_volts_per_bit_x=0.0083799
adc_volts_per_bit_y=0.0083799
adc_sensitivity_x=1.02
adc_sensitivity_y=1.02

[shadow]
# Explicit startup-only opt-in. Default behavior opens no WFS timing stream or diagnostic file.
enabled=false
# REQUIRED BEFORE OPT-IN: exact verified existing WFS timing stream name. Not a WFS modal input.
# camwfs_sync appears in repository timing examples; its current presence/semantics are NOT assumed.
wfsShmimName=
# REQUIRED BEFORE OPT-IN: new absolute regular .csv path in the private test directory.
# Existing files and symlinks are rejected. Snapshot rows follow telemetryFps, not the 2-kHz prediction rate.
logFile=
# Leave zero for initial testing. File-only opposing model-coordinate gain [0,1], not a physical DM gain.
gain=0
# Verify against the actual timing producer. This does not define the physical exposure center.
maxWfsAge_us=2000

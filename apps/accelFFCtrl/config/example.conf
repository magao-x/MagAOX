# Non-actuating accelerometer observer. No output stream or actuator enable exists.
# Calibration must match the acc000 producer; ADC calibration is not in stream metadata.
[input]
shmimName=acc000
threadPrio=2
cpuset=
sampleRate=8000
maxBatch=256
predictionFps=2000
telemetryFps=5
maxAge_us=2000
maxInterval_us=2000
maxPrediction_ms=50
clockTolerance_us=1000

[parameters]
frequency=28.5
memory_time=0.1
lever_arm=10
rotation=0
prediction_horizon=1
adc_zero_x=2048
adc_zero_y=2048
adc_volts_per_bit_x=0.0083799
adc_volts_per_bit_y=0.0083799
adc_sensitivity_x=1.02
adc_sensitivity_y=1.02

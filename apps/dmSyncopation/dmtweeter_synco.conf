# Starting configuration for local bring-up and operator timing qualification.
# These conservative bounds intentionally do not claim feasible 3-step operation:
# at 2 kHz the full reader/copy/early-main window can fit only two steps.
# The app reports the requested three-step schedule infeasible; it never lowers N.
# Replace timing bounds only with qualified evidence before instrument use.

[shmimMonitor]
shmimName=dmC
threadPrio=30
cpuset=spare61

[streams]
destinations=dm01disp07,dm01disp08
combined=dm01disp
timing=dmtweeter_synco_timing

[scheduler]
maxSubframes=3
maxCadenceHz=6000
keepoutUs=115
guardUs=20
step0LeadUs=20
deliveryUs=20
snapshotBudgetUs=10
copyBudgetUs=10
visibilityUs=1
preparationReserveUs=2
outputTimeoutUs=50

[tracking]
cameraDevice=camwfs
nominalMainRateHz=2000
minMainRateHz=500
maxMainRateHz=4000
earlyMainUs=20
observationLagUs=5
lockFrames=32
rateTolerance=0.01
rateFrames=32
primarySemaphore=5

[recovery]
consecutiveMisses=3

[feedback]
gain=0.1
maxAdvanceUs=20

[telemeter]
maxInterval=10

# Merge these sections into the existing shadow instance configuration.
# Request three fixed slots per 2 kHz main cycle; no real DM copies/triggers.
# Actual mains require exact observed read_done. Virtual auxiliary bounds below
# are model assumptions, not measured completion of virtual commands.
# The conservative backend155 bound blocks the final nominal slot before an
# early main. Inspect backendWrap skips; requested 6 kHz is not delivered 6 kHz.

[scheduler]
maxSubframes=3

[simulation]
enabled=true
readerReleaseReady=true
virtualReaderUs=30
backendUs=155

[readerReleaseMonitor]
shmimName=dmtweeter_read_done
threadPrio=30
cpuset=spare57

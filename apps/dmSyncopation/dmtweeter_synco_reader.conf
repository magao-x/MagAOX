# Non-default settings for the shadow reader-protection comparison.
# The dmtweeter controller must publish dm.completionStream=dmtweeter_done.
# Install as the instance configuration before launch; -c alone does not replace it.
# No enable request or auxiliary provider is needed. No DM commands are written.

[shmimMonitor]
shmimName=dm01disp03

[scheduler]
maxSubframes=2

[simulation]
enabled=true

[completionMonitor]
shmimName=dmtweeter_done

# Optional independent early endpoint; configure dm.readerReleaseStream on the controller.
[readerReleaseMonitor]
shmimName=dmtweeter_read_done

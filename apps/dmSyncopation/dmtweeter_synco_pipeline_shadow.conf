# Add these settings to the working dmtweeter-synco instance configuration.
# Keep its existing streams, reader-release observer, guards and CPU settings.
# The controller must publish dmtweeter_read_done; this remains a read-only shadow.
# Three requested steps model 6 kHz conditionally and may still be skipped to
# preserve zero added main SDK wait. These durations are explicit assumptions.

[scheduler]
maxSubframes=3

[simulation]
enabled=true
readerReleaseReady=true
pipelineBackend=true
virtualReaderUs=60
prepareUs=35
sdkServiceUs=120
postUs=150

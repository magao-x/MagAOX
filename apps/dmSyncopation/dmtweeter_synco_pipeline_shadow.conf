# Add these settings to the working dmtweeter-synco instance configuration.
# Keep its existing streams, reader-release observer, guards and CPU settings.
# The controller must publish dmtweeter_read_done; this remains a read-only shadow.
# Three requested steps model 6 kHz conditionally and may still be skipped to
# preserve zero added main SDK wait. These durations are explicit assumptions.
# prepareUs=25 is a provisional shadow bound: 2.658 us above the largest
# receipt-to-SDK-entry maximum (22.342 us) in the optimized 212117Z and 234448Z
# captures. The compiled default remains 35 us; this does not qualify 6 kHz.
# See doc/delivery-preparation-test.md and the engineering record:
# agents/plans/2026-10/dm-syncopation-release-readiness-shadow.md

[scheduler]
maxSubframes=3

[simulation]
enabled=true
readerReleaseReady=true
pipelineBackend=true
virtualReaderUs=60
prepareUs=25
sdkServiceUs=120
postUs=150

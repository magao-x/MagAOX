# Merge these sections into the existing working dmtweeter-synco configuration.
# Preserve instance-specific streams, controller settings and CPU placement.
# Providers must use the version-2 dev::dmSyncopationProducer protocol.
# Changing nonzero commands and the selected mappings need operator qualification.
# The 70/20 us preparation leads cover the tested four-channel mapping below.
# Qualify snapshot/copy time again after changing geometry or mapping count.

[production]
enabled=true
readyLeadUs=70
step0LeadUs=20
lateUs=6
wakeAheadUs=10

[zeroTest]
enabled=false

[simulation]
enabled=false
readerReleaseReady=false
pipelineBackend=false

[scheduler]
maxSubframes=4
maxCadenceHz=8000

[streams]
destinations=dm01disp07,dm01disp08,dm01disp09,dm01disp10
timing=dmtweeter_synco_timing

[readerReleaseMonitor]
shmimName=dmtweeter_read_done
threadPrio=30
cpuset=dmtweeter-synco-release

# Optional complete main-identity history for loopTimingMonitor automatic mode changes.
# Empty keeps this diagnostic disabled. To enable, set dmtweeter_synco_main_timing.
[diagnostics]
mainTimingStream=
mainTimingCapacity=32768

# Merge these sections into the working dmtweeter-synco instance configuration.
# This is a finite REAL-write trial, not a replacement for the instance config.
# Keep main/camera at 2 kHz and retain existing stream/CPU/controller settings.
# Turn enable.toggle On only after setup checks; Off cancels the trial.

[scheduler]
maxSubframes=2

[simulation]
enabled=false
readerReleaseReady=false
pipelineBackend=false

[zeroTest]
enabled=true
channel=dm01disp07
durationSec=120
lateUs=5

[readerReleaseMonitor]
shmimName=dmtweeter_read_done
threadPrio=30
cpuset=dmtweeter-synco-release

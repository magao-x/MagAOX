# Operational loPredCtrlAcc. Controls start OFF; prediction uses the existing tagged DM producer.
# Standard DDSPC is single-rate (one held command per 2 kHz WFS frame), trained only while standard is selected.
# Assisted DDSPC recalculates every 8 kHz DM slot from the newest ACC sample, trained only while assisted is selected.
# Copy the deployed loPredCtrl parameters and WFS selection when they differ from this recorded profile.
loopPause = 100000000

[parameters]
gain = 0.3
regularization = 100.0
gamma = 1.0
covariance = 1e-5
history = 15
future = 3
num_modes = 2
qrd = true
# Seconds of learning after the learn_std sequence ends before learning turns off (0: at its end). Also the INDI
# number learn_std_extra, which can be changed while running.
learn_std_extra = 0
# As loPredCtrl: true destroys the output stream at shutdown. false keeps it, so the main loop never loses its input.
own_shmim = false
# Number of WFS periods of individual ACC history: 5 retains 20 X/Y pairs at 8 kHz. acc_ratio x accel_history must
# fit the 128-sample ACC history (accel_history <= 8 for a 500 Hz WFS, where acc_ratio is 16).
accel_history = 5
# DM slots per WFS frame (the DM scheduler's steps per cycle) and ACC samples per WFS frame. 0 detects each while
# running: dm_slots from syncopation.timingStream, acc_ratio from the ACC samples received per WFS frame, rounded, at
# any ACC rate (the ACC need not be synchronized to or a multiple of the WFS: 7990 Hz at a 2 kHz WFS gives 4, 7000 Hz
# gives 4 or 3, kept within 0.6 of the current value). Two agreeing one-second windows confirm a value; a change
# resizes and resets the models while prediction is off, and prediction is refused until both are known
# (rates.dm_slots, rates.acc_ratio). 1-16 fixes the value instead.
dm_slots = 0
acc_ratio = 0
# Assisted only: weight on command variation within each future frame, scaled like regularization. 0 is the
# unmodified DDSPC cost; 10 suppresses within-frame ripple the 2 kHz WFS cannot observe (see RTC_TESTING.md).
ripple = 10
# Accepted for existing configurations and unused: the assisted fit learns and predicts without the upstream lock.
assisted_diagnostic = false
modal_index0 = 0
modal_index1 = 1
# Source-silence removal, in seconds; independent of ACC and upstream timing diagnostics.
input_timeout = 0.01
# The WFS and ACC histories are the newest measurements received, in arrival order: a missed or late frame neither
# breaks nor fills them. max_fill is kept for existing configurations and only sizes the copied-slot ring (0-20).
max_fill = 5
# Seconds a stale or invalid WFS, or an ACC stream silent for longer than adc.max_age_us, may last before prediction
# stops. Meanwhile no slot is rendered, so the DM holds its command, and prediction resumes by itself when the input
# returns. 0 stops at once (0-60). A lost upstream lock never stops assisted prediction; it only pauses learning.
hold_timeout = 1.0

[integrator]
# When true, each DDSPC command is integrated with the main loop's mfilt law, s = mult*s - gain*delta clipped to
# +/-limit, before synco writes s to dm.channelName. gain, mult and limit are always the main loop's, followed as they
# change: [loop] device's loop_gain, loop_multcoeff and loop_max_limit times this mode's aolN_mgainfact,
# aolN_mmultfact and aolN_mlimitfact. Standard mode integrates once per WFS frame; assisted mode every DM slot with
# gain/dm_slots. Both fits are trained on the deltas. Prediction is refused until all six have been received, so the
# main loop's tip/tilt gain must be nonzero. true is the default; false applies DDSPC commands as absolute positions.
# See agents/plans/2026-11/ddspc-standard-integrator.md.
enabled = true

[loop]
# Main loop's cacaoInterface INDI device, and the cacao loop number N of the aolN_m*fact streams.
device = holoop
number = 1

[shmimMonitor]
# Use the exact incoming modal stream from the deployed loPredCtrl.conf.
shmimName = aol1_modevalWFS
threadPrio = 2
# WFS decisions and all learning run on this thread (assisted: ~160 us per 500 us frame while learning on a
# development Mac). Verify spare28 is unused.
cpuset = spare28
getExistingFirst = false

[framegrabber]
# Main-loop modal output, always on, as the original loPredCtrl: every WFS frame is republished. Prediction off: copied
# unchanged. Prediction on (until DDSPC's own zero is confirmed): modes 0 and 1 are zero, all other modes unchanged
# (README: RTC_TESTING.md, "Main-loop modal output"; ddspc_control.main_loop_tt reports which). With ddspc_mode
# main_loop, modes 0 and 1 carry the standard DDSPC delta for mfilt instead, and dm.channelName is unused (RTC_TESTING.md,
# "Main-loop route"). Unset, shmimName is this application's name, the frameGrabber default. Set it, with
# threadPrio/cpuset, as in the deployed loPredCtrl.conf [framegrabber] section when the main loop reads that stream. It
# must differ from [shmimMonitor] shmimName; never leave it empty, which stops startup. Stop loPredCtrl first: only one process may publish the stream.
#shmimName = <the stream the main loop's modal filter reads>

[dm]
# One producer per scheduler destination (exclusive <aux>.producer lock); acc000 owns dm01disp10_aux, dmSpeckle
# uses dm01disp07_aux. dmcomb sums the destinations, so disturbance and correction coexist on separate channels.
# DDSPC writes the tweeter through dm01disp05. Verify dm01disp05 is in the scheduler's [streams] destinations and that
# dm01disp05_aux has no other producer.
channelName = dm01disp05_aux
# Dedicated DM worker, as accelSim and dmSpeckle: below the scheduler's priority 30. Verify spare29 is unused.
threadPrio = 20
cpuset = spare29
# Every slot is rendered this long before its cutoff, from the newest WFS decision (and, assisted, the newest ACC
# sample), so a decision completed while the slot waits is not a slot late. Tune from ddspc_performance margin_us_min
# and acc_age_calc_us_*.
renderLeadUs = 40
# A failed DM write (discarded command, scheduler reset or restart, lost receipt, channel unavailable) never stops
# prediction: it is counted in ddspc_performance.dm_write_failures and the next slot is written. A commit with no
# receipt after this long counts as failed so the output never stalls on it [ms].
receiptTimeoutMs = 100
# The same synthesis cube/basis used by the operational modal-to-DM conversion.
modeCube = /opt/MagAOX/cacao/tweeter-vispyr/tweeter-vispyr-calibs/default/CMmodesDM/CMmodesDM.00.fits
# Optional additional mask. Empty preserves the complete deployed synthesis planes, without renormalization.
mask =
# Optional existing DDSPC_MODAL_V1 calibration, including complete synthesis and projection; overrides the FITS cube.
calibration =

[syncopation]
timingStream = dmtweeter_synco_timing
# 125 us publishes as soon as a slot is rendered, at cutoff - renderLeadUs.
writeLeadUs = 125

[adc]
# Standard DDSPC remains operational with enabled=false or a disconnected/invalid ACC stream.
enabled = true
shmimName = acc000
# This profile and these calibration values are from the repository's acc000 configuration.
profile = accelSim12
min_code = 0
max_code = 4095
reject_rails = true
# Every in-range sample is used as it arrives on this computer, at any rate: the producer's timestamps and clock,
# sample intervals and lost publications are only counted. capacity is the reader's ring; max_age_us is the ACC
# silence (no sample received) after which assisted holds the DM (then stops after parameters.hold_timeout);
# max_interval_us and clock_tolerance_us are accepted for existing configurations.
capacity = 4096
max_age_us = 20000
max_interval_us = 1000
clock_tolerance_us = 1000
zero0 = 2048
zero1 = 2048
volts_per_count0 = 0.0083799
volts_per_count1 = 0.0083799
sensitivity0 = 1.02
sensitivity1 = 1.02
polarity0 = 1
polarity1 = 1
# The upstream lock, shown as accel_sync and in assisted_qualification only: it gates neither learning nor prediction,
# so acc000 may run free (synchro.timingSource = integrator).
sync_device = acc000
sync_property = timingDiag
# For AD7689, use the deployed ADC calibration and upstream ddspcTiming device/property instead.

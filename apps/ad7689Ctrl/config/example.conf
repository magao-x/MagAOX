# Separate instance: ad7689Ctrl -n ad7689Ctrl -c apps/ad7689Ctrl/config/example.conf
# Commissioning profile; target hardware must be operated by the user, not an agent.
[accel]
numChannels=2
fps=2000
# Optional ordered physical inputs; omit numChannels or keep it consistent.
# channels=[0,1]

[spi]
bus=0
channel=0
baud=1000000
# The Python comparison profile uses baud=2000000 (production BW remains full).

[cnv]
chip=/dev/gpiochip0
line=8
# Verify the chip/offset and release spi0 CS0 ownership before requesting GPIO8.

[adc]
vref=3.32
conversionTime_ns=10000
spiSetup_ns=1000
quietTime_ns=1000
# 8-channel/8-kHz candidates require explicit timing qualification, for example
# spi.baud=4000000 or 8000000 and conversionTime_ns=4000. Never reduce guards blindly.

[framegrabber]
shmimName=accad7689_test
circBuffLength=1
threadPrio=2
cpuset=

[fps]
device=
property=fps
element=current
tol=0

[numChannels]
device=
property=numChannels
element=current
tol=0

[synchro]
# Empty selects timer mode; a named stream triggers one complete scan per semaphore wake.
shmimName=
postDelay=0
alpha=0.01
dtTransfer_ns=3000
wfsProcess_ns=51500
dtF_ns=10000
wfsRead_ns=276100
delayLockAbsThreshold_ns=50000
delayLockFracThreshold=0.1
cadenceGuard_ns=20000

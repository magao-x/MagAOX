# Separate instance: ad7689Ctrl -n ad7689Ctrl -c apps/ad7689Ctrl/config/example.conf
# Commissioning profile; target hardware must be operated by the user, not an agent.
[accel]
numChannels=2
fps=2000
# For a 2 kHz WFS, fps=8000 schedules four scans; fps=6000 schedules three.
# Optional ordered physical inputs; omit numChannels or keep it consistent.
# channels=[0,1]

[spi]
bus=0
channel=0
baud=1000000
# The Python comparison profile uses baud=2000000 (production BW remains full).

[cnv]
chip=/dev/gpiochip0
line=8
# Verify the chip/offset and release spi0 CS0 ownership before requesting GPIO8.

[adc]
vref=3.32
conversionTime_ns=10000
spiSetup_ns=1000
quietTime_ns=1000
# 8-channel/8-kHz candidates require explicit timing qualification, for example
# spi.baud=4000000 or 8000000 and conversionTime_ns=4000. Never reduce guards blindly.

[framegrabber]
shmimName=accad7689_test
circBuffLength=1
threadPrio=2
cpuset=

[fps]
device=
property=fps
element=current
tol=0

[numChannels]
device=
property=numChannels
element=current
tol=0

[synchro]
# Empty selects timer mode. A named stream phase-aligns multiple scans per WFS period.
shmimName=
# Optional startup WFS hint; zero waits for two triggers to measure cadence.
referenceFps=0
timeout=1.0
# Opt-in continuous DDSPC mode. False preserves the finite legacy scan schedule.
ddspcDelayEnabled=false
# DDSPC phase/cadence use a ten-second monotonic regression, not individual arrivals.
# Startup and genuine cadence changes require this many consistent unique events.
wfsFitMinEvents=16
# Relative change gate, augmented by a 20 us floor and six times inlier jitter RMS.
wfsCadenceTolerance=0.1
# Initial start = WFS period/2 + processing - ACC-to-publication latency - margin.
# These model values give 300 us at 2 kHz WFS; calibrate latency on the actual board.
wfsProcessTime_ns=75000
accLatency_ns=15000
ddspcMargin_ns=10000
# Slew only future intervals by at most this fraction, also bounded by scan headroom.
ddspcSlewFraction=0.05
# User offset in us; applied once to either selected model.
postDelay=0
alpha=0.01
dtTransfer_ns=3000
wfsProcess_ns=51500
dtF_ns=10000
wfsRead_ns=276100
delayLockAbsThreshold_ns=50000
delayLockFracThreshold=0.1
cadenceGuard_ns=20000

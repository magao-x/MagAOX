# Same-host provider example for operator-run qualification.
# Start dmSyncopation first so that the auxiliary source exists.
# No main destination or primary-trigger stream is opened by this provider.

[dm]
channelName=dm01disp07_aux
trigger=off
amp=0.01
# Each orthogonal axis vibrates at 200 Hz, in quadrature.
# This physical frequency is independent of the 6 kHz scheduler cadence.
frequency=200

[modulator]
opMode=tiptilt
threadPrio=20
# Select a suitable provider core locally; do not share the scheduler's spare61.
cpuset=tweeterSpeck

[syncopation]
timingStream=dmtweeter_synco_timing
writeLeadUs=50

# Example monitor configuration. Source devices and stream names are independent.
[camera]
device=camwfs
shmimName=camwfs
clock=realtime
quantizationUs=1

[dm]
device=dmtweeter
shmimName=dmtweeter_sdk_start

[loop]
device=holoop

# Optional automatic production-synco integration; set all three together.
# Example: dmtweeter-synco / dmtweeter_synco_main_timing / dmtweeter_sdk_events
[synco]
device=
mainStream=
sdkStream=

[monitor]
maxFPS=3600
pollSleepUs=10
windowSec=2
capacity=32768
clockBracketUs=1
clockMaxAgeMs=100
threadPrio=0
cpuset=

# In the existing BMC controller configuration, separately enable:
# [sdk]
# workerEnabled=true
# pipelineEnabled=true
# startTimeStream=dmtweeter_sdk_start
# For automatic synco mode, also configure BMC:
# timingEventStream=dmtweeter_sdk_events
# timingEventCapacity=32768
# And dmSyncopation:
# [diagnostics]
# mainTimingStream=dmtweeter_synco_main_timing
# mainTimingCapacity=32768

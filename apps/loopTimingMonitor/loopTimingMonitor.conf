# Example monitor configuration. Source devices and stream names are independent.
[camera]
device=camwfs
shmimName=camwfs
clock=realtime
quantizationUs=1

[dm]
device=dmtweeter
shmimName=dmtweeter_sdk_start

[loop]
device=holoop

[monitor]
maxFPS=3600
pollSleepUs=10
windowSec=2
capacity=32768
clockBracketUs=1
clockMaxAgeMs=100
threadPrio=0
cpuset=

[state]
pollSec=1
timeoutSec=5

# In the existing BMC controller configuration, separately enable:
# [sdk]
# workerEnabled=true
# pipelineEnabled=true
# startTimeStream=dmtweeter_sdk_start

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "xapp-audibleAlerts"
description =  "Audible alerting and text-to-speech for MagAO-X"
version = "2025.11.30"
dependencies = [
  "xconf",
  "purepyindi2",
]
authors = [
  {name = "Joseph D. Long", email = "me@joseph-long.com"},
]

[project.scripts]
audibleAlerts = "xapp.audibleAlerts:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["xapp*"]

[tool.setuptools.package-data]
"xapp.audibleAlerts" = ["personalities/*"]

# Example instance configuration for counterOffload on the RTC.
# Start dmSyncopation first so that the auxiliary source exists, and make sure
# dm01disp08 is in synco's streams.destinations list.
# The app starts disabled; the operator enables it with
#   setINDI -s <instance>.enable.toggle=On

[shmimMonitor]
# t2wOffloader's offload change as it appears on the tweeter
shmimName=aol0_tweeterOffload

[counterOffload]
channel=dm01disp08_aux
# Raised-cosine ramp fitted to the woofer rise (see agents/plans/2026-11/counter-offload-app.md)
rampStartUs=120
rampDurationUs=330
# 0 holds the contribution; otherwise the fraction removed after each published slot
leak=0
timeOffsetUs=0
# Use a small gain when first qualifying on the instrument (0 to 2)
gain=1
# clip level for every pixel of the command and of the held contribution
maxCommand=0.5
computeLeadUs=20
threadPrio=20
cpuset=spare26

[syncopation]
timingStream=dmtweeter_synco_timing
writeLeadUs=10

# Calibrate mode.  All of these are the defaults and may be omitted.
[psds]
# modalPSDs closed-loop PSDs, averaged over psdAvgTime
shmimName=aol1_clpsds

[calibrate]
freqStream=aol1_freq
offloadDevice=t2wOffloader
halfWidthHz=10
# 0 uses t2wOffloader.numModes
modeMax=0
nAverage=3
baselineEvery=5
# must cover the modalPSDs average, psdAvgTime + psdTime
settleS=11
timeoutS=5
abortRatio=3
# leak used during a run, restored afterwards
leak=0.0025
startGridUs=0,400,25
durationGridUs=100,600,50
gainGrid=0.1,1.0,0.1
csvDir=/home/xsup/counterOffload

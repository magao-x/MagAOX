# Example instance configuration for counterOffload on the RTC.
# Start dmSyncopation first so that the auxiliary source exists, and make sure
# dm01disp08 is in synco's streams.destinations list.
# The app starts disabled; the operator enables it with
#   setINDI -s <instance>.enable.toggle=On

[shmimMonitor]
# t2wOffloader's offload change as it appears on the tweeter
shmimName=aol0_tweeterOffload

[counterOffload]
channel=dm01disp08_aux
# rampStartUs, rampDurationUs, gain, leak, timeOffsetUs and maxCommand default to the
# best values measured on the bench (see doc/counterOffload.md).  They are also INDI
# properties; set them here only to keep calibrated values across restarts.
computeLeadUs=20
threadPrio=20
cpuset=spare26

[syncopation]
timingStream=dmtweeter_synco_timing
writeLeadUs=10

# Calibrate mode.  These are the defaults and may be omitted.  The scan grids and the
# other calibration settings are INDI properties only (calib*), not config keys.
[psds]
# modalPSDs closed-loop PSDs, averaged over psdAvgTime
shmimName=aol1_clpsds

[calibrate]
freqStream=aol1_freq
offloadDevice=t2wOffloader
csvDir=/home/xsup/counterOffload
